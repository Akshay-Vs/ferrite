include:
  - docker-compose.base.yaml

services:
  ferrite-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ferrite-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ferrite-postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      ferrite-postgres:
        condition: service_healthy
    networks:
      - ferrite_network

  ferrite-redis-exporter:
    image: oliver006/redis_exporter:alpine
    container_name: ferrite-redis-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      - REDIS_ADDR=redis://ferrite-redis-cache:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      ferrite-redis-cache:
        condition: service_healthy
    networks:
      - ferrite_network

  ferrite-redis-sessions-exporter:
    image: oliver006/redis_exporter:alpine
    container_name: ferrite-redis-sessions-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_SESSIONS_EXPORTER_PORT:-9122}:9121"
    environment:
      - REDIS_ADDR=redis://ferrite-redis-sessions:6379
      - REDIS_PASSWORD=${REDIS_SESSIONS_PASSWORD}
    depends_on:
      ferrite-redis-sessions:
        condition: service_healthy
    networks:
      - ferrite_network

  ferrite-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ferrite-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/open-telemetry/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
    depends_on:
      - ferrite-jaeger
      - ferrite-prometheus
      - ferrite-loki
    networks:
      - ferrite_network

  ferrite-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ferrite-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - ferrite_network

  ferrite-prometheus:
    image: prom/prometheus:latest
    container_name: ferrite-prometheus
    volumes:
      - ./monitoring/open-telemetry/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - ferrite_network

  ferrite-loki:
    image: grafana/loki:3.3.2
    container_name: ferrite-loki
    user: "0"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/open-telemetry/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - ferrite_network

  ferrite-grafana:
    image: grafana/grafana:latest
    container_name: ferrite-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./monitoring/open-telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3200:3000"
    depends_on:
      - ferrite-prometheus
      - ferrite-loki
      - ferrite-jaeger
      - ferrite-postgres
    networks:
      - ferrite_network

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
